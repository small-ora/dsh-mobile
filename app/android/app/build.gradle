plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

// versionCode/versionName 可由命令行覆盖：-PversionCode=42 -PversionName=0.1.0
def injectedVersionCode = (project.findProperty('versionCode') ?: '1').toString()
def injectedVersionName = (project.findProperty('versionName') ?: '0.1.0').toString()

// 发布签名键不入库（REVIEW P0）：从 local.properties（本地，gitignored）或环境变量读取。
//   DSH_MOBILE_KEYSTORE_FILE / DSH_MOBILE_KEYSTORE_PASSWORD / DSH_MOBILE_KEY_ALIAS / DSH_MOBILE_KEY_PASSWORD
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def signingValue = { String key ->
  def fromEnv = System.getenv(key)
  if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
  def fromProps = localProps.getProperty(key)
  return (fromProps != null && !fromProps.trim().isEmpty()) ? fromProps.trim() : null
}
def keystorePath = signingValue('DSH_MOBILE_KEYSTORE_FILE') ?: 'keystore/dsh-mobile.jks'
def releaseKeystore = rootProject.file(keystorePath)
def keystorePassword = signingValue('DSH_MOBILE_KEYSTORE_PASSWORD')
def keyAliasValue = signingValue('DSH_MOBILE_KEY_ALIAS')
def keyPasswordValue = signingValue('DSH_MOBILE_KEY_PASSWORD')
def releaseSigningReady = releaseKeystore.exists() && keystorePassword && keyAliasValue && keyPasswordValue

android {
  namespace 'com.smallora.dshmobile'
  compileSdk 36

  defaultConfig {
    applicationId 'com.smallora.dshmobile'
    minSdk 31
    targetSdk 36
    versionCode injectedVersionCode as int
    versionName injectedVersionName

    // M1 只交付 arm64-v8a（SPEC §3 目标设备）
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  signingConfigs {
    // 固定签名保证覆盖升级；密钥由本地 local.properties 或 CI secrets 注入，不入库。
    if (releaseSigningReady) {
      release {
        storeFile releaseKeystore
        storePassword keystorePassword
        keyAlias keyAliasValue
        keyPassword keyPasswordValue
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      if (releaseSigningReady) signingConfig signingConfigs.release
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      applicationIdSuffix null
    }
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  packaging {
    resources {
      excludes += [
        '/META-INF/{AL2.0,LGPL2.1}',
        'META-INF/DEPENDENCIES',
        'META-INF/LICENSE*',
        'META-INF/NOTICE*',
        'META-INF/*.kotlin_module'
      ]
    }
  }

  testOptions {
    unitTests {
      returnDefaultValues = true
      all {
        it.useJUnit()
      }
    }
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

dependencies {
  implementation platform('androidx.compose:compose-bom:2025.10.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-core'

  implementation 'androidx.activity:activity-compose:1.11.0'
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'

  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  debugImplementation 'androidx.compose.ui:ui-tooling'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
